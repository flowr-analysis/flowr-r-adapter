# Daily: if a newer flowR is on npm, retarget the package to it
# (tools/bump-flowr.sh), run the check and open a release pull request.
#
# Quiet by design: nothing new means a green no-op; a failing check does NOT
# fail the job (that would mail every day until fixed) but turns the pull
# request into a draft listing the failures. Nothing is released until someone
# squash-merges the pull request with its title unchanged (see release.yml).
name: flowr-update
on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:
  repository_dispatch:
    types: [flowr-release]

concurrency:
  group: flowr-update

env:
  BRANCH: auto/flowr-update
  BOT: flowr-update-bot <41898282+github-actions[bot]@users.noreply.github.com>

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check for a new flowR version
        id: check
        run: |
          retry() { for i in 1 2 3 4; do "$@" && return; sleep $((i * 15)); done; return 1; }
          latest=$(retry npm view @eagleoutice/flowr version)
          current=$(sed -n -E 's/.*flowr_version[[:space:]]*=[[:space:]]*"([^"]*)".*/\1/p' R/config.R | head -1)
          echo "current flowR $current, latest $latest"
          echo "latest=$latest" >> "$GITHUB_OUTPUT"
          # only move forward, never to an older release
          if [ "$latest" = "$current" ] || [ "$(printf '%s\n%s\n' "$current" "$latest" | sort -V | tail -1)" != "$latest" ]; then
            echo "Already on flowR $current"; exit 0
          fi
          if git fetch -q origin "$BRANCH" 2>/dev/null; then
            # never overwrite fixes someone pushed to the update branch
            if git log --format='%an <%ae>' "origin/main..origin/$BRANCH" | grep -qvxF "$BOT"; then
              echo "::notice::$BRANCH has manual commits, leaving it alone"; exit 0
            fi
            # the open pull request already targets this version: nothing to redo
            if git show "origin/$BRANCH:R/config.R" | grep -qF "\"$latest\""; then
              echo "$BRANCH already targets flowR $latest"; exit 0
            fi
          fi
          echo "update=true" >> "$GITHUB_OUTPUT"

      - name: Update flowR
        if: steps.check.outputs.update
        run: |
          retry() { for i in 1 2 3; do "$@" && return; sleep $((i * 15)); done; return 1; }
          retry tools/bump-flowr.sh "$LATEST"
        env:
          LATEST: ${{ steps.check.outputs.latest }}

      - name: Install R
        if: steps.check.outputs.update
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.4.0'
      - name: Install dependencies
        if: steps.check.outputs.update
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: devtools

      # same gate as test.yml; the pull request then runs the full matrix.
      # A failure does not fail the job: it makes the pull request a draft.
      - name: Run devtools::check()
        if: steps.check.outputs.update
        id: test
        run: |
          mkdir -p logs
          if Rscript -e 'devtools::check(error_on = "warning")' > logs/check.log 2>&1; then
            echo "report=\`devtools::check()\` passed with the new version." >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "failed=true" >> "$GITHUB_OUTPUT"
          echo "::warning::devtools::check() fails with the new flowR"
          {
            echo 'report<<EOF_REPORT'
            echo "**\`devtools::check()\` fails.** Push fixes to \`$BRANCH\`, then mark this ready. [Logs]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID)"
            echo '```'
            sed 's/\x1b\[[0-9;]*m//g' logs/check.log \
              | grep -aE '^\[ FAIL|── (Failure|Error)|Error in|ERROR|WARNING|checking .* \.\.\. (ERROR|WARNING)|errors? ✖|warnings? ✖' \
              | head -n 60 | cut -c1-300 || true
            echo '```'
            echo 'EOF_REPORT'
          } >> "$GITHUB_OUTPUT"

      - name: Upload check log
        if: always() && steps.check.outputs.update
        uses: actions/upload-artifact@v4
        with:
          name: check-log
          path: logs
          if-no-files-found: ignore

      - name: Create pull request
        if: steps.check.outputs.update
        id: pr
        uses: peter-evans/create-pull-request@v7
        with:
          # a token other than GITHUB_TOKEN, so the pull request triggers the regular CI
          token: ${{ secrets.RELEASE_TOKEN }}
          branch: ${{ env.BRANCH }}
          delete-branch: true
          add-paths: |
            MAINTAINING.md
            NEWS.md
            R
            inst/flowr-js
            man
            tests
            vignettes
          author: ${{ env.BOT }}
          committer: ${{ env.BOT }}
          draft: ${{ steps.test.outputs.failed && 'always-true' || 'false' }}
          commit-message: '[release:patch] Bump to flowR ${{ steps.check.outputs.latest }}'
          title: '[release:patch] Bump to flowR ${{ steps.check.outputs.latest }}'
          body: |
            Updates flowR to [${{ steps.check.outputs.latest }}](https://github.com/flowr-analysis/flowr/releases/tag/v${{ steps.check.outputs.latest }}): rebuilt `inst/flowr-js` and bumped every reference to the old version (`tools/bump-flowr.sh`).

            ${{ steps.test.outputs.report }}

            Before merging, check the flowR release notes for new queries, linter rules or changed result shapes the adapter should know about.
            Squash-merge with the title unchanged to release; the release builds the native binaries for this flowR version.

      - name: Mark pull request ready
        if: steps.pr.outputs.pull-request-number && !steps.test.outputs.failed
        run: gh pr ready "${{ steps.pr.outputs.pull-request-number }}" || true
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
